name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbershop-api

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes automatizados
        run: mvn -B clean test

      - name: Empacotar aplicação (.jar)
        run: mvn -B clean package -DskipTests

      - name: Validar build da imagem Docker
        run: docker build -t barbearia-api:ci .
