name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbershop-api

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: barbearia
          MYSQL_USER: barbearia_user
          MYSQL_PASSWORD: barbearia_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes automatizados
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/barbearia?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: barbearia_user
          SPRING_DATASOURCE_PASSWORD: barbearia_pass
        run: mvn -B clean test

      - name: Empacotar aplicação (.jar)
        run: mvn -B clean package -DskipTests

      - name: Validar build da imagem Docker
        run: docker build -t barbearia-api:ci .
